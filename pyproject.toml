[project]
name = "kimi-k3-mlx-distributed"
version = "0.1.0"
description = "Streaming conversion and JACCL/RDMA pipeline inference for Kimi-K3 on Apple Silicon"
requires-python = ">=3.13,<3.14"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=1.0,<2",
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "numpy>=2.3",
    "pillow>=11.3",
    "psutil>=7.0",
    "safetensors>=0.6",
    "tiktoken>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "torch>=2.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
